  - 0.12
  - 0.18
  - 0.25
  # 模板匹配并行线程数：cv2 的 matchTemplate/cvtColor 会释放 GIL，多线程可并行
  # 加速全规则扫描而不改变任何匹配结果。0 = 自动（min(12, CPU核数)）；1 = 纯串行。
  matching_workers: 0
  # GPU 加速匹配兼容开关：仅在未设置 matching_mode 的旧配置中生效；新模式统一使用
  # OpenCV CPU/CUDA。matching_mode 优先级更高；hybrid 会让 CPU 线程池与 OpenCV CUDA
  # 队列并行。无 CUDA 构建时自动回退 CPU。
  matching_gpu: false
  # 模板匹配后端：cpu / gpu / hybrid。hybrid 会把规则按预计工作量分成两组，
  # CPU 线程池和单 GPU 队列同时运行；无 CUDA 时自动全部回退 CPU。
  matching_mode: cpu
  matching_source_cache_entries: 12
  # 帧级 GPU 缓存条目数：同一帧上 (mode, 参数, ROI) 不同的预处理源各占一项，
  # 超出时按 LRU 淘汰旧帧。hsv 各规则阈值各异无法共享，此项只影响灰度复用。
  matching_gpu_cache_entries: 6
  # OpenCV 原生 CUDA 匹配（cv2.cuda.matchTemplate）：true=GPU/hybrid 模式启用
  # OpenCV CUDA 队列；false=即使选择 GPU/hybrid 也回退 OpenCV CPU。注意标准
  # conda-forge / PyPI opencv 通常不带 CUDA，真正启用需使用 CUDA 构建版本。
  matching_cv2_cuda: false
  # 变尺寸 CUDA 批量 NCC：同一帧/同一预处理源的不同尺寸模板合并为一次 FFT。
  matching_batch_cuda: false
  # FFT 点数上限（不是字节数）；运行时还会按可用显存动态收紧
  matching_batch_fft_area: 8000000
  matching_cuda_batch_size: 256
  matching_batch_gpu_fraction: 0.4
  # find_first 并行分批大小：按配置优先级分批扫描，批内并行、批间保持"先到先得"。
  matching_batch_size: 8
  unknown_pause_seconds: 25
  startup_unknown_pause_seconds: 120
  unknown_stable_seconds: 4.0
  transition_wait_seconds: 6.0
  # 黑屏“加载中...”是网络/资源过渡，不应按普通未知画面 25 秒暂停。
  loading_pause_seconds: 120
  action_stuck_pause_seconds: 20
  same_rule_screen_change_threshold: 8
  same_rule_center_change_threshold: 35
  foreground_check_seconds: 15
  # 前台被切走时有限次拉回 FGO；连续失败才暂停，避免一闪而过的窗口
