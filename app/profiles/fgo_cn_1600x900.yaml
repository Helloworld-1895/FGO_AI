    confirm_skill_use: true
    accelerate_skill_animations: true
    accelerate_np_animations: true
    use_charge_skills: true
    prioritize_charge_for_main: true
    use_attack_buffs: true
    use_evasion_skills: true
    use_guts_skills: true
    use_support_skills: true
    use_replacement_skills: true
    prefer_primary_output_cards: true
    prefer_damage_role_over_class: true
    prefer_card_class_advantage: true
    prefer_same_servant_chain: true
    prefer_same_color_chain: true
    prefer_arts_chain: false
    prefer_high_critical_cards: true
    prefer_mighty_chain: true
    prefer_np_charge_cards: true
    continue_with_replacement: true
  max_turns: 20
  total_waves: 3
  # 按面(波次)追踪：配置后每回合对 stage_count_region ROI 拍快照（镜像 FGA
  # StageTracker），ROI 变化即进入下一面；未配置(0,0,0,0)时回退
  # "回合数重置 + 敌方全满血"两个信号。需按 1600x900 校准后填写。
  stage_count_region:
  - 0
  - 0
  - 0
  - 0
  # 场次 X/Y 的 OCR 读取区域（战斗 UI 右上角、回合数 battle_turn_region 上方，
  # FGO 显示 "当前面/总面数"）。默认关闭(0,0,0,0)：模型提示词已要求从截图
  # 直接读出场次，本地 wave_tracker 做无模型时的兜底；仅当需要"本地逻辑也能
  # 精确判面"时才校准并填写（FGA MasterLocations.stageCountRegion 换算初值约
  # 1040,10,1170,60，需实测）。
  stage_ocr_region:
  - 0
  - 0
  - 0
  - 0
  # 每面策略：key 为面数("1"/"2"/"3")，值为该面的 prefer_* 覆盖
  # （键名同 rule_options，另支持 brave_chain_behavior）。默认空 = 全部沿用全局。
  wave_priorities: {}
  # 勇敢链后处理：none 不重排；with_np 计划含宝具时把同从者卡对排到宝具前
  # （best-effort，未校验宝具从者与卡对是否同一人）；avoid 交错避免同一从者连击。
  brave_chain_behavior: none
  # 指令卡颜色低置信度时降级为 unknown 继续出卡（不中断战斗，FGA 教训），
  # 关闭则恢复原来的抛错重试。
  card_unknown_on_low_confidence: true
  # 首次战败始终免费撤退重打；第二次战败仅在 defeat_policy 有授权资源时续关，
  # 否则安全暂停。以下两个点击点用于首次撤退（按 1600x900 校准）。
  # 下方坐标源自 FGA 源码 Locations.kt（2560x1440 基准换算 1600x900，×0.625），
  # 撤退按钮取 withdrawRegion 区域中心、确认按钮取 withdrawAcceptClick；
  # FGO 各服 UI 布局一致，通常可直接用，个别版本需实测微调 ±20px。
  retreat_on_defeat: false
  # 无授权续关资源时的旧版自动处理上限；启用 defeat_policy 且仍有资源时，
  # 以各资源 max_uses 为准。成功结算后连续战败计数清零。
  max_defeats: 2
  defeat_retreat_point:
  - 804
  - 500
  defeat_retreat_confirm_point:
  - 1103
  - 490
  # 资源按钮可能先播放确认弹窗入场动画；轮询约 8 秒，期间识别并点击“决定”。
  defeat_resource_verify_attempts: 12
  defeat_resource_verify_wait_seconds: 0.6
  battle_turn_region:
  - 1080
  - 95
