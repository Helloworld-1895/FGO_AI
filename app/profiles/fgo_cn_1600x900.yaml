battle:
  defeat_policy:
    enabled: false
    allowed_resources: []
    priority: [command_seal, leyline_stone, saint_quartz]
    max_uses:
      command_seal: 0
      leyline_stone: 0
      saint_quartz: 0
  servant_ids_by_slot: {}
  animation_pause_seconds: 180
  animation_recovery_after_seconds: 4
  rule_options:
    prefer_class_advantage: true
    single_np_high_hp: true
    prefer_imminent_charge: true
    use_ready_np: true
    use_support_nps: true
    prefer_support_np_first: true
    prefer_aoe_for_multiple: true
    use_multiple_ready_nps: true
    use_skills: true
    use_all_frontline_skills: true
    use_skill_groups: true
