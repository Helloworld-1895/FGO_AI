  # 可选 generic ADB 后端；默认 mumu 保持兼容
  backend: mumu
  adb_path: ""
  serial: ""
  # backend=adb 时可选择：ldplayer（雷电）、nox（夜神）、memu（逍遥）。
  emulator: ""
  instance_index: 0
  emulator_path: ""
  # 留空时自动扫描常见安装目录；找不到时控制面板会提示手动选择。
  manager_path:
  vm_index: 0
  package: com.bilibili.fatego
  # 强重连：连接时若模拟器未就绪，自动启动（优先快捷方式，其次 MuMuNxMain.exe -p）。
  auto_launch_emulator: true
  launch_package: com.bilibili.fatego
  # 可选：MuMu 桌面快捷方式路径；留 null 时从 MuMuManager 同目录派生 MuMuNxMain.exe。
  launch_shortcut: "C:\\Users\\TX-4\\Desktop\\命运-冠位指定-MuMu安卓设备.lnk"
