    text_context_length: 16
    text_pos_embed_table_size: 77
    interpolate_pos_embed: true
    yolox_model_path: ../models/yolox_s_buttons.onnx
    provider: cpu
    fallback_to_cpu: true
    precision: fp32
    resolution: 1008
    confidence_threshold: 0.45
    default_prompts: ["close button", "confirm button", "automatic party formation button", "decision button"]
    nms_threshold: 0.45
    ocr_iou_threshold: 0.02
    ocr_center_distance_threshold: 1.0
    ocr_safety_min_confidence: 0.2
    output_decoded: true
    normalize_input: false
    input_color_order: bgr
    class_names: [button, icon_button]
    max_candidates: 12
    cache_ttl: 1.5
    verify_timeout_seconds: 1.2
    verify_change_threshold: 3.0
    max_verification_failures: 3
    failure_cooldown_seconds: 10
    allowed_roi: [40, 40, 1560, 860]
    excluded_regions: [[1320, 0, 1600, 220]]
    blocked_ocr_labels: ["圣晶石", "购买", "召唤", "续关", "灵基修复", "宝具解放"]
  notebook_enabled: true
  notebook_runtime_injection_enabled: true
  # Unknown-screen recovery is frame-local; do not resend its long history.
  unknown_notebook_enabled: false
  # Unknown AI may try non-paid OCR/menu actions; Saint Quartz remains blocked.
  allow_nonpaid_unknown_actions: true
  notebook_path: "" # 空 => <项目根>/state/ai_notebook/<mode>.md（每场景独立一份）
  notebook_max_chars: 20000
  notebook_append_max_chars: 2000
  # card 模式每回合咨询是笔记本流水账的主要来源，拉长到 30 秒一次追加；
  # 超限压缩不受此限制。0 = 不限（其它模式默认）。
  notebook_card_append_cooldown_seconds: 30
  # 后台总结：决策落定后把 before/after 截图 + 决策 + 回合内操作交给独立线程
  # 提炼一条笔记写入该场景自己的笔记本。正常不阻塞主进程；仅当同场景下一次
  # AI 咨询到达且该场景总结未完成时才等待。单次总结超时后放弃该次。
  notebook_summary_enabled: false
  notebook_summary_max_tokens: 32768
  notebook_summary_timeout_seconds: 180
  notebook_summary_wait_timeout_seconds: 180
# AP 苹果管理（refill）：镜像 FGA 的苹果降级链。默认关闭 —— 关闭时
# ap_refill 规则仍按"暂停"处理，不消耗任何苹果/圣晶石。开启后需补录
# templates/ap_refill.png 激活规则；各点击点已填入 FGA 换算坐标（见下）。
refill:
  # 全局生效：主线后续关卡也需要体力，弹出体力不足窗口时自动按链消耗苹果。
  # 多余的金苹果未被配置连时不会使用；需要圣晶石时可自行在链末添加 "sq"。
  enabled: true
  # true 表示取消全局本次运行上限；各资源仍按 resource_limits 中的数字执行。
  unlimited: true
  # 降级链：按 便宜→贵 排列（镜像 FGA RefillResourceEnum 的 ordinal 排序
  # Copper→Bronze→Silver→Gold→SQ）。日常最优先用最便宜的铜苹果，金苹果留到最后。
  # 例如 ["copper_apple","bronze_apple","silver_apple","gold_apple"]；
  # 圣晶石（"sq"）可加在链末，但会消耗付费货币，请务必确认愿意消耗。
  # 赤铜苹果在国服不可用，链从青铜开始；数量为 0 自动跳下一个，直到全部苹果用完。
  resources:
  - bronze_apple
  - silver_apple
  - gold_apple
  # 每种资源的点击点。已按 2026-08-16 实测行动力回复弹窗校准（1600x900）：
  # 回顶状态图标质心 圣晶石 470,206 / 金 473,383 / 银 467,570，与 FGA
  # Locations.locate() 2560x1440 换算值吻合；青铜/赤铜在首屏外，需先下滑
  # 一段面板（scroll: 1，配合下方 scroll_to_top 先回顶保证起点稳定），
  # 下滑 1 段后实测质心 银 462,215 / 青铜 467,407 / 赤铜 472,592。
  resource_points:
    sq: [470, 206]
    gold_apple: [473, 383]
    silver_apple: [467, 570]
    bronze_apple: {point: [467, 407], scroll: 1}
    copper_apple: {point: [472, 592], scroll: 1}
  # 点资源前先把列表滚回顶部（镜像 FGA Refill 的滚动条定位意图）。
  # FGO 面板用滑动内容滚动、无独立滚动条，故用一次向下滑动等效，
  # 保证上面首屏坐标稳定；false 则跳过（面板默认即顶部时不必要）。
  scroll_to_top: true
  # 确认框「决定」按钮 [x,y]。2026-08-16 实测决定按钮文字框中心（1049,730）；
  # FGA staminaOkClick 换算值 1031,700 实测偏上约 30px，已校准。
  ok_point: [1049, 730]
  # 点资源后的短暂等待（秒），等「确认」按钮出现
  refill_tap_wait_seconds: 0.6
  # 链耗尽后等回体的秒数；>0 且配置了 close_point 时关闭面板并等待
  wait_for_regen_seconds: 0
  # 链耗尽时关闭体力不足面板的 [x,y]（FGA staminaCloseClick 换算）
  close_point: [800, 775]
  # unlimited=true 时，本字段仅作为兼容/回退值，不会限制有明确 resource_limits 的资源。
  resource_limits:
    gold_apple: 20
    silver_apple: 20
    bronze_apple: 20
  # unlimited=false 且资源未配置单独数字时使用的全局回退上限。
  max_refills_per_session: 20
# 无限刷模式：打完一局回到同一关卡入口界面后，自动再次点击“开始”循环刷。
# start_template 由控制面板【无限刷】粘贴截图生成。
infinite_farm:
  enabled: false
  start_template: templates/infinite_farm_start.png
  # 模板命中后用 OCR 做软位置/文字对齐；OCR 误识别或缺失不会单独阻断点击。
  ocr_alignment_mode: soft
  ocr_expected_labels: ["开始", "开 始", "start"]
  ocr_search_roi: [0, 0, 1600, 900]
  max_template_candidates: 6
  candidate_threshold_margin: 0.08
  candidate_ambiguity_margin: 0.06
  recovery_repeat_limit: 3
  recovery_max_steps: 8
  recovery_no_progress_limit: 3
  recovery_same_frame_distance: 2.5
  recovery_cooldown_seconds: 12
  recovery_success_cooldown_seconds: 1
  # 体力不足时自动补充（全局体力补充已在 refill 段启用）
  refill_ap: true

# 结算页掉落/羁绊停止（默认关闭）。templates 的值可写相对本配置文件的路径。
drop_stop:
  enabled: false
  mode: cumulative  # cumulative / any_hit
  targets: {}
  # 已复制 BBchannel 的素材图标到 profiles/templates/drop；按需填写 targets。
  # 示例：targets: {凶骨: 30, 英雄之证: 20}
  templates:
    '凶骨': templates/drop/凶骨.png
    '英雄之证': templates/drop/英雄之证.png
    '虚影之尘': templates/drop/虚影之尘.png
    '龙之牙': templates/drop/龙之牙.png
    '世界树之种': templates/drop/世界树之种.png
