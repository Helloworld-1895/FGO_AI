    '凤凰羽毛': templates/drop/凤凰羽毛.png
    '无间齿轮': templates/drop/无间齿轮.png
    '禁断书页': templates/drop/禁断书页.png
    '混沌之爪': templates/drop/混沌之爪.png
    '蛮神心脏': templates/drop/蛮神心脏.png
    '真理之卵': templates/drop/真理之卵.png
