- name: ap_refill
  template: templates/ap_refill.png
  threshold: 0.88
  action: refill
  reason: 检测到体力回复界面；refill.enabled 关闭时保持暂停，不消耗任何资源
- name: refill_confirm_decision
  description: 体力补充时“是否执行消耗…？”确认框（含“决定”按钮）。仅用于 _refill_action 判断确认框已弹出，再点“确定”；数量为0或不可用的资源不会弹出该框，此时自动跳过换下一个；本规则本身不执行任何点击。
  template: templates/refill_confirm_decision.png
  # 该模板只有“决定”按钮，剧情/关卡确认框的“开始/确定”按钮外形相近；
  # 只在体力确认按钮的下方区域匹配，并提高阈值，避免误识别剧情对话框。
  threshold: 0.90
  match_mode: gray
  search_roi: [820, 660, 1280, 810]
  template_scales: [0.9, 0.95, 1.0, 1.05, 1.1]
  detect_only: true
  action: refill_confirm_check
